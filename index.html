<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tembak-tembakan 4 vs 4 // FLASH AND LASER NUSANTARA 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@500;700;800&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #060908;
            font-family: 'Chakra Petch', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scrollable-y {
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .selectable-input {
            user-select: text;
            -webkit-user-select: text;
            touch-action: manipulation;
        }

        /* Kontainer Panggung 16:9 Terkunci */
        #stage-frame {
            position: relative;
            width: min(100vw, calc(100dvh * 16 / 9));
            height: min(100dvh, calc(100vw * 9 / 16));
            overflow: hidden;
            background: #131c2e;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.88);
            border: 1px solid rgba(163, 230, 53, 0.25);
            transform-origin: center center;
        }

        /* Auto-Rotasi Otomatis ke Lanskap saat Ponsel dalam Mode Potret */
        #stage-frame.mobile-auto-rotated {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(100dvh, calc(100vw * 16 / 9));
            height: min(100vw, calc(100dvh * 9 / 16));
            transform: translate(-50%, -50%) rotate(90deg);
            border: none;
            box-shadow: none;
        }

        /* Tata Letak Dioptimalkan untuk Layar Ponsel */
        #stage-frame.mobile-mode #stick-zone {
            left: 16px;
            bottom: 16px;
            width: 124px;
            height: 124px;
        }

        #stage-frame.mobile-mode #stick-knob {
            width: 46px;
            height: 46px;
            margin-left: -23px;
            margin-top: -23px;
        }

        #stage-frame.mobile-mode #touch-actions-right {
            right: 14px;
            bottom: 14px;
            gap: 6px;
        }

        #stage-frame.mobile-mode .t-btn {
            min-width: 44px;
            min-height: 44px;
            font-size: 10px;
        }

        #stage-frame.mobile-mode #btn-fire {
            width: 72px;
            height: 72px;
            font-size: 13px;
        }

        #stage-frame.mobile-mode #btn-skill {
            width: 58px;
            height: 58px;
        }

        #stage-frame.mobile-mode #btn-grenade {
            width: 52px;
            height: 52px;
        }

        #stage-frame.mobile-mode .w-pill {
            min-height: 31px;
            padding: 2px 9px;
            font-size: 10px;
        }

        #stage-frame.mobile-mode #hud-bottom-left {
            left: 150px;
            bottom: 14px;
            width: 175px;
        }

        #stage-frame.mobile-mode #hud-bottom-right {
            right: auto;
            left: 150px;
            bottom: 92px;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(9, 14, 24, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .glass-strong {
            background: rgba(8, 12, 21, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Bidikan (Crosshair) */
        #crosshair-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 15;
        }

        .ch-line {
            position: absolute;
            background: rgba(248, 250, 252, 0.96);
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
            transition: transform 0.04s linear;
        }

        #ch-top { width: 2px; height: 8px; left: -1px; top: -14px; }
        #ch-bottom { width: 2px; height: 8px; left: -1px; top: 6px; }
        #ch-left { width: 8px; height: 2px; top: -1px; left: -14px; }
        #ch-right { width: 8px; height: 2px; top: -1px; left: 6px; }
        #ch-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            left: -2px;
            top: -2px;
            background: #ff2a2a;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff2a2a;
        }

        /* Indikator Kena Tembak (Hitmarker) */
        #hitmarker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%) scale(0.75);
            pointer-events: none;
            opacity: 0;
            z-index: 16;
            transition: opacity 0.07s ease-out, transform 0.07s ease-out;
        }
        #hitmarker.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }
        #hitmarker::before, #hitmarker::after {
            content: '';
            position: absolute;
            top: 11px;
            left: 2px;
            width: 20px;
            height: 2px;
            background: #f87171;
            box-shadow: 0 0 6px #ef4444;
        }
        #hitmarker::before { transform: rotate(45deg); }
        #hitmarker::after { transform: rotate(-45deg); }

        /* Teropong Sniper */
        #sniper-scope {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 14;
            background: radial-gradient(circle at center, transparent 26%, rgba(0, 0, 0, 0.96) 28%);
        }
        #sniper-scope::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 20%;
            right: 20%;
            height: 1px;
            background: rgba(248, 113, 113, 0.78);
        }
        #sniper-scope::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 12%;
            bottom: 12%;
            width: 1px;
            background: rgba(248, 113, 113, 0.78);
        }

        /* Vinyet Kerusakan & Arah Serangan */
        #damage-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 12;
            box-shadow: inset 0 0 75px rgba(220, 38, 38, 0);
        }

        #damage-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            margin-left: -80px;
            margin-top: -80px;
            border-radius: 50%;
            border-top: 6px solid rgba(239, 68, 68, 0.9);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid transparent;
            pointer-events: none;
            z-index: 13;
            opacity: 0;
        }

        /* Lapisan HUD Berskala */
        #hud-scalable-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            transform-origin: center center;
        }

        /* Stik Analog Virtual Kiri */
        #stick-zone {
            position: absolute;
            left: 14px;
            bottom: 14px;
            width: 106px;
            height: 106px;
            z-index: 22;
            pointer-events: auto;
        }

        #stick-base {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            background: rgba(15, 23, 34, 0.56);
            border: 2px solid rgba(255, 255, 255, 0.24);
            box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.55);
        }

        #stick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 40px;
            height: 40px;
            margin-left: -20px;
            margin-top: -20px;
            border-radius: 9999px;
            background: radial-gradient(circle at 35% 30%, rgba(163, 230, 53, 0.95), rgba(22, 163, 74, 0.85));
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transform: translate3d(0px, 0px, 0);
            will-change: transform;
        }

        /* Area Sentuh Putar Kamera Kanan */
        #look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 65%;
            height: 100%;
            z-index: 11;
            pointer-events: auto;
        }

        /* Tombol Aksi Sentuh */
        .t-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            min-height: 38px;
            border-radius: 9999px;
            background: rgba(15, 23, 34, 0.74);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #f8fafc;
            font-weight: 700;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
            transition: transform 0.06s ease, background 0.08s ease, border-color 0.08s ease;
            pointer-events: auto;
            cursor: pointer;
        }

        .t-btn.pressed, .t-btn.toggled {
            transform: scale(0.93);
            background: rgba(22, 163, 74, 0.42);
            border-color: #a3e635;
        }

        .t-btn.crouching {
            background: rgba(250, 204, 21, 0.34);
            border-color: #facc15;
            color: #fef08a;
        }

        #btn-fire {
            width: 60px;
            height: 60px;
            background: rgba(239, 68, 68, 0.42);
            border: 2px solid rgba(248, 113, 113, 0.9);
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
        }
        #btn-fire.pressed {
            background: rgba(239, 68, 68, 0.76);
            border-color: #ffffff;
            transform: scale(0.92);
        }

        #btn-grenade {
            width: 48px;
            height: 48px;
            background: rgba(234, 88, 12, 0.36);
            border: 1.8px solid rgba(251, 146, 60, 0.85);
        }

        #btn-skill {
            position: relative;
            overflow: hidden;
            width: 52px;
            height: 52px;
            background: rgba(14, 116, 144, 0.48);
            border: 2px solid rgba(34, 211, 238, 0.85);
            box-shadow: 0 0 14px rgba(34, 211, 238, 0.25);
        }
        #btn-skill.on-cooldown {
            border-color: rgba(148, 163, 184, 0.45);
            background: rgba(15, 23, 42, 0.8);
        }
        #btn-skill.skill-active {
            border-color: #fde047;
            box-shadow: 0 0 18px rgba(250, 204, 21, 0.65);
        }
        #skill-cd-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 0%;
            background: rgba(2, 6, 23, 0.74);
            pointer-events: none;
            transition: height 0.06s linear;
        }

        .w-pill {
            min-height: 27px;
            padding: 1px 7px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.03em;
            background: rgba(11, 16, 23, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #cbd5e1;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .w-pill.active {
            background: rgba(22, 163, 74, 0.35);
            border-color: #a3e635;
            color: #ffffff;
        }
        .w-pill.locked {
            opacity: 0.42;
            color: #94a3b8;
        }

        .char-card {
            transition: all 0.12s ease;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(12, 18, 28, 0.82);
            cursor: pointer;
        }
        .char-card.selected {
            border-color: var(--accent, #a3e635);
            background: rgba(18, 29, 44, 0.95);
            box-shadow: 0 0 0 1px var(--accent, #a3e635), 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        .mode-btn {
            transition: all 0.12s ease;
            cursor: pointer;
        }
        .mode-btn.selected-classic {
            border-color: #a3e635;
            background: rgba(22, 163, 74, 0.24);
            color: #ecfccb;
        }
        .mode-btn.selected-ranked {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.24);
            color: #fffbeb;
        }

        /* Lencana Poster FLASH AND LASER dengan Bingkai Kamuflase Hutan */
        .poster-camo-frame {
            padding: 3px;
            border-radius: 12px;
            background:
                radial-gradient(circle at 20% 25%, #3f6212 0%, #3f6212 28%, transparent 29%),
                radial-gradient(circle at 78% 70%, #78350f 0%, #78350f 30%, transparent 31%),
                radial-gradient(circle at 70% 22%, #14532d 0%, #14532d 26%, transparent 27%),
                linear-gradient(135deg, #4d7c0f, #166534, #92400e);
            box-shadow: 0 0 16px rgba(132, 204, 22, 0.35), 0 0 10px rgba(239, 68, 68, 0.25);
        }

        .poster-badge {
            background: linear-gradient(135deg, rgba(16, 40, 24, 0.95), rgba(48, 24, 10, 0.95));
            border: 1px solid rgba(190, 242, 100, 0.75);
        }

        /* Slider Pengaturan */
        input[type="range"].nusantara-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 999px;
            background: rgba(30, 41, 59, 0.95);
            outline: none;
            touch-action: manipulation;
        }
        input[type="range"].nusantara-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #a3e635;
            border: 2px solid #ffffff;
            cursor: pointer;
        }
        input[type="range"].nusantara-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #a3e635;
            border: 2px solid #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="stage-frame">
    <!-- Kanvas 3D WebGL (Arena Nusantara 112x112 + Karakter 3D Artikulasi + Senjata Flash & Laser) -->
    <canvas id="game-canvas"></canvas>

    <!-- Area Sentuh Kamera Kanan -->
    <div id="look-zone" class="hidden"></div>

    <!-- Overlay Efek Kerusakan & Teropong -->
    <div id="damage-vignette"></div>
    <div id="damage-indicator"></div>
    <div id="sniper-scope" class="hidden"></div>

    <!-- Bidikan Tengah & Hitmarker -->
    <div id="crosshair-wrap" class="hidden">
        <div id="ch-top" class="ch-line"></div>
        <div id="ch-bottom" class="ch-line"></div>
        <div id="ch-left" class="ch-line"></div>
        <div id="ch-right" class="ch-line"></div>
        <div id="ch-dot"></div>
    </div>
    <div id="hitmarker"></div>

    <!-- Lapisan HUD Pertarungan Berskala -->
    <div id="hud-scalable-layer">
        <!-- Bilah HUD Atas -->
        <div id="hud-top" class="absolute top-2 left-2.5 right-2.5 hidden flex items-center justify-between gap-2 pointer-events-none">
            <div class="glass px-2.5 py-1 rounded-lg flex items-center gap-2 text-[11px] pointer-events-auto">
                <span id="hud-mode-badge" class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase bg-lime-500/20 text-lime-300 border border-lime-400/35">KLASIK</span>
                <span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase bg-red-600/30 text-red-200 border border-red-400/40 hidden md:inline">FLASH AND LASER · NUSANTARA</span>
                <span id="hud-mobile-badge" class="hidden px-1.5 py-0.5 rounded text-[9px] font-bold uppercase bg-cyan-500/25 text-cyan-200 border border-cyan-400/40">MODE PONSEL</span>

                <div class="flex items-center gap-1.5 mono font-extrabold">
                    <span class="text-lime-400">KITA <span id="ally-rounds-text">0</span></span>
                    <span class="text-slate-500">:</span>
                    <span class="text-red-400"><span id="enemy-rounds-text">0</span> LAWAN</span>
                </div>

                <span class="text-white/20">|</span>
                <div>
                    <span class="text-slate-400 text-[9px] uppercase mr-0.5">RND</span>
                    <span id="round-display" class="mono font-bold text-amber-400">1/7</span>
                </div>

                <span class="text-white/20">|</span>
                <div class="mono font-extrabold text-lime-300 text-xs">
                    $<span id="hud-money-text">800</span>
                </div>

                <span class="text-white/20 hidden sm:inline">|</span>
                <div class="hidden sm:flex items-center gap-1 mono text-[10px] font-bold">
                    <span class="text-lime-300">K:<span id="ally-alive-text">4</span></span>
                    <span class="text-red-300">L:<span id="enemy-alive-text">4</span></span>
                </div>
            </div>

            <div class="flex items-center gap-1.5 pointer-events-auto">
                <button id="btn-fullscreen-rotate" type="button" class="hidden px-2 py-1 rounded-lg text-[10px] font-extrabold uppercase bg-cyan-500/25 text-cyan-200 border border-cyan-400/45 cursor-pointer">
                    LAYAR PENUH
                </button>
                <button id="btn-open-buy" type="button" class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase bg-amber-500 hover:bg-amber-400 text-slate-950 shadow cursor-pointer">
                    BELI [B]
                </button>
                <span id="fps-display" class="glass mono text-[10px] font-bold text-lime-400 px-2 py-1 rounded-lg">60 FPS</span>
                <button id="btn-hud-settings" type="button" class="glass text-cyan-200 hover:text-white px-2 py-1 rounded-lg text-[10px] font-bold uppercase cursor-pointer">
                    ATUR
                </button>
                <button id="btn-mute" type="button" class="glass text-slate-200 px-2 py-1 rounded-lg text-[10px] font-bold uppercase cursor-pointer">
                    SUARA NYALA
                </button>
                <button id="btn-pause" type="button" class="glass text-slate-200 px-2 py-1 rounded-lg text-[10px] font-bold uppercase cursor-pointer">
                    JEDA
                </button>
            </div>
        </div>

        <!-- Spanduk Zona Beli Pra-Ronde -->
        <div id="prep-banner" class="absolute top-10 left-1/2 -translate-x-1/2 hidden pointer-events-auto">
